<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANBUMITHTHIRAN 56 RADIO - anbumiththiran.in</title>
<style>
body{background:radial-gradient(circle at top,#220010,#000);color:#fff;font-family:system-ui;min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{color:#ff0040;letter-spacing:2px;margin-bottom:2px}
.sub{opacity:.6;font-size:13px;margin-bottom:24px}
.radio{width:100%;max-width:380px;background:#111;border:1px solid #222;border-radius:28px;padding:24px;box-shadow:0 20px 60px #000;text-align:center}
.disc{width:180px;height:180px;margin:0 auto 18px;background:conic-gradient(#ff0040,#000,#ff0040);border-radius:50%;display:flex;align-items:center;justify-content:center;animation:spin 6s linear infinite;animation-play-state:paused}
.disc.playing{animation-play-state:running}
.disc-inner{width:70px;height:70px;background:#000;border-radius:50%;border:3px solid #ff0040;display:flex;align-items:center;justify-content:center;font-size:28px}
@keyframes spin{to{transform:rotate(360deg)}}
#now{font-weight:800;font-size:18px;margin:10px 0 4px}
#count{opacity:.5;font-size:12px;margin-bottom:12px}
audio{width:100%;margin:10px 0}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px}
.btn{background:#222;color:#fff;border:1px solid #333;padding:10px 16px;border-radius:12px;font-weight:700}
.btn.main{background:#ff0040;border-color:#ff0040}
.live{margin-top:12px;font-size:11px;letter-spacing:2px;color:#ff0040;font-weight:700}
.list{width:100%;max-width:380px;margin-top:18px;max-height:240px;overflow:auto}
.item{padding:10px 12px;background:#0f0f0f;border-bottom:1px solid #1a1a1a;font-size:13px;display:flex;justify-content:space-between;cursor:pointer}
.item.active{color:#ff0040;background:#1a0a0e}
</style></head><body>
<h1>ANBUMITHTHIRAN</h1>
<p class="sub">56 RADIO — anbumiththiran.in — LIVE</p>

<div class="radio">
  <div class="disc" id="disc"><div class="disc-inner">🎧</div></div>
  <div id="now">Click Play — Radio Start</div>
  <div id="count">56 Paadalgal — Non-Stop</div>
  <audio id="audio" preload="metadata" playsinline controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false"></audio>
  <div class="row">
    <button class="btn" id="prev">⏮</button>
    <button class="btn main" id="play">▶ PLAY RADIO</button>
    <button class="btn" id="next">⏭</button>
  </div>
  <div class="row">
    <button class="btn" id="shuffle">🔀 Shuffle: OFF</button>
    <button class="btn" id="auto">▶ Auto: ON</button>
  </div>
  <div class="live">● LIVE RADIO — NO DOWNLOAD</div>
</div>

<div class="list" id="list"></div>

<script>
const SONGS = Array.from({length:56},(_,i)=>{
  let n=String(i+1).padStart(2,'0');
  return {n, title:`${n}_ta-IN-ValluvarNeural`}
});

let idx=0, isShuffle=false, isAuto=true;
const audio=document.getElementById('audio');
const now=document.getElementById('now');
const count=document.getElementById('count');
const disc=document.getElementById('disc');
const list=document.getElementById('list');
const playBtn=document.getElementById('play');

function src(i){ return `./audio/${SONGS[i].n}_ta-IN-ValluvarNeural.mp3`; }

function load(i, play=true){
  idx=i;
  audio.src=src(idx);
  now.textContent=`${SONGS[idx].n}. ${SONGS[idx].title}`;
  count.textContent=`${idx+1} / 56 — Radio Playing`;
  if(play) audio.play();
  render();
}

function next(){
  if(isShuffle){ load(Math.floor(Math.random()*SONGS.length)); }
  else { if(idx<55) load(idx+1); else load(0); }
}
function prev(){ if(idx>0) load(idx-1); else load(55); }

function render(){
  list.innerHTML=SONGS.map((s,i)=>`<div class="item ${i===idx?'active':''}" onclick="load(${i})"><span>${s.n}. Anbudan Miththiran</span><span>${i===idx?'●':''}</span></div>`).join('');
}

playBtn.onclick=()=>{
  if(audio.paused){ audio.play(); } else { audio.pause(); }
};
audio.onplay=()=>{ disc.classList.add('playing'); playBtn.textContent='⏸ PAUSE'; };
audio.onpause=()=>{ disc.classList.remove('playing'); playBtn.textContent='▶ PLAY RADIO'; };
audio.onended=()=>{ if(isAuto) next(); };

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('shuffle').onclick=(e)=>{
  isShuffle=!isShuffle; e.target.textContent=`🔀 Shuffle: ${isShuffle?'ON':'OFF'}`;
};
document.getElementById('auto').onclick=(e)=>{
  isAuto=!isAuto; e.target.textContent=`▶ Auto: ${isAuto?'ON':'OFF'}`;
};

render();
load(0,false);
// Need one click to start due to browser policy
now.textContent="🎙 ANBUMITHTHIRAN 56 RADIO — Tap PLAY";
</script></body></html>
